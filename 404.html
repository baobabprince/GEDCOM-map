    <script>
      // Immediate trailing slash enforcement for GitHub Pages subdirectories
      // Prevents relative assets from resolving to the parent root domain (404)
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if (host.indexOf('github.io') !== -1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
