name: Restore knownLocations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-known-locations.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file from history
        run: |
          set -eux
          git show 633015b2b416113f7642788343707d7bf2e610af:services/knownLocations.ts > services/knownLocations.ts
          sed -i 's/},\s*,/},/g' services/knownLocations.ts
          head -c 80 services/knownLocations.ts
          echo
          grep -n "south africa" services/knownLocations.ts | head -3
          wc -c services/knownLocations.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/knownLocations.ts
          git status
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "fix(build): restore knownLocations.ts and remove double commas"
          git push origin HEAD:main
