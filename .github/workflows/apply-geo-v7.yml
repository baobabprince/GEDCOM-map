name: Apply geo v7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-geo-v7.yml'
      - 'scripts/apply-geo-v7.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-geo-v7.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/nominatimService.ts services/knownLocations.ts
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "fix(geo): skip Photon on Pages (CORS), expand Hebrew/diaspora places"
          git push origin HEAD:main
