name: Fix onLoadShared

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-onloadshared.yml'
      - 'scripts/fix-onloadshared-props.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-onloadshared-props.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: pass onLoadShared props into SidebarContent (runtime crash)"
          git push origin HEAD:main
