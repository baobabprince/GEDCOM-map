name: Fix knownLocations syntax

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-known-locations-syntax.yml'
      - 'scripts/fix-known-locations-syntax.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-known-locations-syntax.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/knownLocations.ts
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "fix(build): remove double comma in knownLocations.ts"
          git push origin HEAD:main
